<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Brindes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" hidden>
    <aside class="lateral">
      <div class="marca" id="marca-nome">Brindes</div>
      <nav id="menu">
        <a href="#/painel" data-rota="painel">📊 Painel</a>
        <a href="#/novo" data-rota="novo" class="destaque">＋ Novo orçamento</a>
        <a href="#/orcamentos" data-rota="orcamentos">📝 Orçamentos</a>
        <a href="#/pedidos" data-rota="pedidos">📦 Pedidos</a>
        <a href="#/clientes" data-rota="clientes">👥 Clientes</a>
        <a href="#/produtos" data-rota="produtos">🏷️ Produtos</a>
        <a href="#/config" data-rota="config">⚙️ Configurações</a>
      </nav>
      <div class="modo" id="modo"></div>
    </aside>
    <main id="main"></main>
  </div>

  <div id="login" hidden>
    <form class="cartao login" id="f-login">
      <h1>Gestão de Brindes</h1>
      <label class="campo"><span>E-mail</span><input name="email" type="email" required autocomplete="username"></label>
      <label class="campo"><span>Senha</span><input name="senha" type="password" required autocomplete="current-password"></label>
      <button class="btn">Entrar</button>
      <p class="erro" id="login-erro"></p>
    </form>
  </div>

  <div id="impressao"></div>
  <div id="toasts"></div>

  <script src="js/config.js"></script>
  <script>
    // Só carrega a biblioteca da nuvem se o Supabase estiver configurado
    if (window.APP_CONFIG.SUPABASE_URL) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>');
    }
  </script>
  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
